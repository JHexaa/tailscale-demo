name: CD - Deploy Simple (SSH Direct)

# Este workflow es más simple y no requiere Tailscale OAuth
# Usa SSH directo a tu servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Starting deployment..."

            # Ir al directorio del proyecto
            cd ~/tailscale-demo || mkdir -p ~/tailscale-demo

            # Pull cambios si es un repo git, sino crear desde cero
            if [ -d .git ]; then
              echo "==> Pulling latest changes..."
              git pull origin main
            else
              echo "==> Cloning repository..."
              cd ~
              rm -rf tailscale-demo
              git clone https://github.com/${{ github.repository }}.git tailscale-demo
              cd tailscale-demo
            fi

            # Crear .env si no existe
            if [ ! -f .env ]; then
              echo "==> Creating .env file..."
              cat > .env << 'EOF'
            POSTGRES_USER=tailscale_user
            POSTGRES_PASSWORD=tailscale_pass_2024
            POSTGRES_DB=tailscale_demo
            DATABASE_URL=postgresql://tailscale_user:tailscale_pass_2024@db:5432/tailscale_demo
            MINIO_ACCESS_KEY=minioadmin
            MINIO_SECRET_KEY=minioadmin123secure
            MINIO_BUCKET=images
            MINIO_PUBLIC_URL=http://localhost:9000
            EOF
            fi

            echo "==> Building and deploying..."
            docker compose build --no-cache api
            docker compose up -d

            echo "==> Waiting for services..."
            sleep 10

            echo "==> Health check..."
            curl -s http://localhost:8000/api/health

            echo "==> Deployment complete!"

      - name: Notify success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify failure
        if: failure()
        run: echo "Deployment failed!"
