name: CI - Build and Test

on:
  push:
    branches: [main, feature/auth-module]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [auth-service, api-gateway]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm install

      - name: Generate Prisma Client (auth-service only)
        if: matrix.service == 'auth-service'
        working-directory: backend/${{ matrix.service }}
        run: npx prisma generate

      - name: Build
        working-directory: backend/${{ matrix.service }}
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-service image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth-service
          push: false
          tags: auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api-gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          push: false
          tags: api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
