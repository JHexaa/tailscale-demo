name: CD - Deploy to Server

on:
  push:
    branches: [main, feature/auth-module]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Proxmox VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH connection OK'"

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          echo "==> Starting deployment..."

          cd ~/tailscale-demo || { mkdir -p ~/tailscale-demo && cd ~/tailscale-demo; }

          # Get current branch from remote
          BRANCH="${GITHUB_REF_NAME:-feature/auth-module}"
          echo "==> Deploying branch: $BRANCH"

          if [ -d .git ]; then
            echo "==> Fetching and checking out branch..."
            git fetch origin
            git checkout $BRANCH 2>/dev/null || git checkout -b $BRANCH origin/$BRANCH
            git pull origin $BRANCH
          else
            echo "==> Cloning repository..."
            cd ~
            rm -rf tailscale-demo
            git clone -b $BRANCH https://github.com/JHexaa/tailscale-demo.git tailscale-demo
            cd tailscale-demo
          fi

          # Get Tailscale IP
          TS_IP=$(tailscale ip -4)
          echo "==> Tailscale IP: $TS_IP"

          # Create .env file for NestJS auth services
          echo "==> Creating .env file..."
          cat > .env << EOF
          # Database
          POSTGRES_USER=tailscale
          POSTGRES_PASSWORD=tailscale_2024
          POSTGRES_DB=auth_db

          # Redis
          REDIS_PASSWORD=redis_2024

          # JWT
          JWT_SECRET=your-super-secret-jwt-key-change-in-production-$(openssl rand -hex 16)
          JWT_ACCESS_EXPIRY=15m
          JWT_REFRESH_EXPIRY=7d

          # CORS
          CORS_ORIGINS=http://localhost:3000,https://${TS_IP}
          EOF

          echo "==> Stopping old containers..."
          docker compose down --remove-orphans 2>/dev/null || true

          echo "==> Building and deploying NestJS services..."
          docker compose build --no-cache
          docker compose up -d

          echo "==> Waiting for services to start..."
          sleep 15

          echo "==> Running database migrations..."
          docker exec auth-service npx prisma migrate deploy || echo "Migration may need manual intervention"

          echo "==> Running seed (if needed)..."
          docker exec auth-service npx prisma db seed || echo "Seed may already exist"

          echo "==> Health check..."
          curl -s http://localhost:3000/api/health || echo "Gateway health check pending..."
          curl -s http://localhost:3001/auth/health || echo "Auth service health check pending..."

          echo "==> Container status..."
          docker ps

          echo "==> Deployment complete!"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -s http://localhost:3000/api/health || echo 'Checking services...'; docker ps"
