name: CD - Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Proxmox VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add host to known_hosts
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH connection OK'"

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'

          set -e
          echo "==> Starting deployment..."

          cd ~/tailscale-demo || { mkdir -p ~/tailscale-demo && cd ~/tailscale-demo; }

          if [ -d .git ]; then
            echo "==> Pulling latest changes..."
            git pull origin main
          else
            echo "==> Cloning repository..."
            cd ~
            rm -rf tailscale-demo
            git clone https://github.com/${{ github.repository }}.git tailscale-demo
            cd tailscale-demo
          fi

          # Create .env if not exists
          if [ ! -f .env ]; then
            echo "==> Creating .env file..."
            cat > .env << 'EOF'
          POSTGRES_USER=tailscale_user
          POSTGRES_PASSWORD=tailscale_pass_2024
          POSTGRES_DB=tailscale_demo
          DATABASE_URL=postgresql://tailscale_user:tailscale_pass_2024@db:5432/tailscale_demo
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin123secure
          MINIO_BUCKET=images
          MINIO_PUBLIC_URL=http://localhost:9000
          EOF
          fi

          echo "==> Building and deploying..."
          docker compose build --no-cache api
          docker compose up -d

          echo "==> Waiting for services..."
          sleep 10

          echo "==> Health check..."
          curl -s http://localhost:8000/api/health || echo "Health check pending..."

          echo "==> Deployment complete!"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -s http://localhost:8000/api/health"
